<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello Mackenzie — Sophia</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #fdf2f8;
            font-family: Arial, sans-serif;
            color: #352333;
        }

        main {
            width: min(480px, 85%);
            padding: 40px 24px;
            background: white;
            text-align: center;
            border-radius: 20px;
            box-shadow: 0 10px 35px #00000012;
        }

        h1 {
            color: #be185d;
        }

        p {
            line-height: 1.6;
        }

        .tag {
            display: inline-block;
            padding: 8px 16px;
            background: #fce7f3;
            border-radius: 20px;
            color: #9d174d;
        }
    </style>
</head>

<body>
    <main>
        <span class="tag">Engenharia da Computação</span>
        <h1>Hello, Mackenzie!</h1>
        <p>Meu nome é Sophia Betoni.</p>
        <p>Minha aplicação com Flask e Docker está funcionando!</p>
        <small>Versão 1.0</small>
    </main>
</body>
</html>
